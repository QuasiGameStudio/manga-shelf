# --- Gradle ---
org.gradle.daemon=true
org.gradle.jvmargs=-Xms512M -Xmx2G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# --- libGDX ---
gdxVersion=1.14.2

# --- HTML5 / GWT ---
# Pinned to the same versions as the other games in this repo so every web build uses one
# toolchain. The Gradle plugin needs Gradle 8.x; this project uses the 8.14 wrapper.
gwtFrameworkVersion=2.11.0
gwtPluginVersion=2.2.7
